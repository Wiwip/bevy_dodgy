[package]
name = "bevy_dodgy_2d"
version = "0.5.0"
edition = "2021"

license = "MIT OR Apache-2.0"

categories = ["game-development"]
keywords = ["orca", "rvo", "collision", "avoidance", "navigation"]

[dependencies]
dodgy_2d = "0.5"
rand = "0.9"
avian3d = "0.3.0"
avian2d = "0.3.0"

[dependencies.bevy]
version = "0.16.0"
default-features = false

[dev-dependencies]
simple_camera = { path = "../simple_camera" }

[dev-dependencies.bevy]
version = "0.16.0"
default-features = true

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy)
[profile.dev.package."*"]
opt-level = 3

[features]
default = ["2d"]
2d = []
3d = []