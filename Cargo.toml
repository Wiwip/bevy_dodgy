[package]
name = "bevy_dodgy_2d"
version = "0.5.0"
edition = "2021"

license = "MIT OR Apache-2.0"

categories = ["game-development"]
keywords = ["orca", "rvo", "collision", "avoidance", "navigation"]

[dependencies]
dodgy_2d = { git = "https://github.com/Wiwip/dodgy.git" }
rand = "0.10"
avian3d = { version = "0.6", optional = true }
avian2d = { version = "0.6", optional = true }

[dependencies.bevy]
version = "0.18"
default-features = false

[dev-dependencies]
bevy_top_down_camera = { path = "../bevy_top_down_camera" }

[dev-dependencies.bevy]
version = "0.18"
default-features = true

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy)
[profile.dev.package."*"]
opt-level = 3

[features]
default = []
2d = ["dep:avian2d"]
3d = ["dep:avian3d"]